<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us | Izhaan Zia Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar" style="display: flex; justify-content: space-between; align-items: center; padding: 20px;">
    <h1 class="logo" style="margin: 0; font-size: 24px;"><u>Izhaan Zia</u></h1>
    <ul class="nav-links" style="list-style: none; display: flex; gap: 20px; margin: 0;">
      <li><a href="index.html" style="text-decoration: none; color: inherit;">Home</a></li>
      <li><a href="Project.html" style="text-decoration: none; color: inherit;">Projects</a></li>
      <li class="active" style="cursor: pointer;">Contact</li>
    </ul>
  </nav>
  
  <main>
    <section class="contact">
      <div class="contact-info">
        <h1>Contact Me</h1>
        <p>Feel free to reach out! I’m available for work, collaborations, or simply a chat.</p>
        <div class="social-links">
          <a href="https://twitter.com" class="social-btn">Twitter</a>
          <a href="https://github.com" class="social-btn">GitHub</a>
          <a href="mailto:izhaanzia@gmail.com" class="social-btn"> Email </a>
          <a href="https://linkedin.com" class="social-btn" target="_blank">LinkedIn</a>
        </div>
      </div>

      <div class="contact-form">
        <h2>Get in Touch</h2>
        <form action="#" method="POST">
          <input type="text" name="name" placeholder="Your Name" required />
          <input type="email" name="email" placeholder="Your Email" required />
          <textarea name="message" placeholder="Your Message" rows="6" required></textarea>
          <button type="submit" class="cta-btn">Send Message</button>
        </form>
      </div>
    </section>
  </main>

  <footer>
    &copy; 2025 Izhaan Zia. All rights reserved.
  </footer>

</body>
</html>
